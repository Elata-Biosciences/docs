name: One-time documentation localization
on:
  push:
    branches: [docs/chinese-spanish-2026-10-11]
    paths: [scripts/localize-docs.cjs, scripts/localization-input.json, .github/workflows/localize-once.yml]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/chinese-spanish-2026-10-11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install temporary MDX validation dependencies
        run: npm install --prefix "$RUNNER_TEMP/elata-docs-qa" --no-save --ignore-scripts @mdx-js/mdx@3 yaml@2 github-slugger@2 remark-gfm@4
      - name: Compile every page and verify locale parity
        run: node scripts/validate-locales.cjs
      - name: Persist translation progress on the task branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cn es docs.json
          if [ -f scripts/localization-cache.json ]; then git add scripts/localization-cache.json; fi
          if [ -f scripts/localization-qa.json ]; then git add scripts/localization-qa.json; fi
          if [ -f scripts/localization-fallbacks.json ]; then git add scripts/localization-fallbacks.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'docs: synchronize Chinese and add Spanish translations'
            git push origin HEAD:docs/chinese-spanish-2026-10-11
          fi
